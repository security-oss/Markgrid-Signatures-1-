<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markgrid Email Signature Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f5f7; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        .signature-preview-box {
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #f8f9fa 25%, transparent 25%, transparent 75%, #f8f9fa 75%, #f8f9fa),
                linear-gradient(45deg, #f8f9fa 25%, transparent 25%, transparent 75%, #f8f9fa 75%, #f8f9fa);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            border: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            min-height: 300px;
        }
        #signature-preview {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
        }

        .floating-label-input {
            position: relative;
        }
        .floating-label-input input {
            padding: 1.25rem 1rem 0.5rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            width: 100%;
            transition: all 0.2s;
            font-size: 0.875rem;
        }
        .floating-label-input input:focus {
            border-color: #5A5AEE;
            box-shadow: 0 0 0 4px rgba(90, 90, 238, 0.1);
            outline: none;
        }
        .floating-label-input label {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 0.875rem;
            transition: all 0.2s;
            pointer-events: none;
        }
        .floating-label-input input:focus + label,
        .floating-label-input input:not(:placeholder-shown) + label {
            top: 0.75rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: #5A5AEE;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded bg-[#5A5AEE] text-white flex items-center justify-center font-bold text-xl">m</div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">Signature<span class="text-[#5A5AEE]">Tool</span></h1>
            </div>
            <button onclick="copySignature()" class="bg-[#5A5AEE] hover:bg-[#4a4ad8] text-white px-5 py-2 rounded-md font-semibold text-sm transition-all shadow-sm hover:shadow flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" /></svg>
                Copy to Clipboard
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="flex flex-col lg:flex-row gap-8">
            
            <!-- Controls Sidebar -->
            <div class="w-full lg:w-1/3 flex flex-col gap-6">
                
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider mb-5 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#5A5AEE]" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>
                        Employee Profile
                    </h2>
                    
                    <div class="space-y-4">
                        <div class="floating-label-input">
                            <input type="text" id="name" value="VIKRAM TOMAR" placeholder=" " autocomplete="off">
                            <label>Full Name</label>
                        </div>
                        <div class="floating-label-input">
                            <input type="text" id="title" value="CXO's Office" placeholder=" " autocomplete="off">
                            <label>Designation</label>
                        </div>

                        <div class="floating-label-input">
                            <input type="email" id="email" value="vikram.tomar@markgrid.ai" placeholder=" " autocomplete="off">
                            <label>Email Address</label>
                        </div>
                        <div class="floating-label-input">
                            <input type="text" id="phone" value="+91 9811505259" placeholder=" " autocomplete="off">
                            <label>Phone Number</label>
                        </div>


                    </div>
                </div>



            </div>

            <!-- Preview Area -->
            <div class="w-full lg:w-2/3 flex flex-col gap-6">
                
                <!-- Visual Preview -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full">
                    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                        <h2 class="text-sm font-bold text-slate-900 uppercase tracking-wider">Live Preview</h2>
                        <div class="flex items-center gap-1 bg-white border border-slate-200 rounded shadow-sm p-1">
                            <button onclick="setZoom(-0.1)" class="w-6 h-6 flex items-center justify-center text-slate-500 hover:text-slate-900 hover:bg-slate-50 rounded transition-colors" title="Zoom Out">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" /></svg>
                            </button>
                            <span id="zoom-level" class="text-xs font-semibold text-slate-600 w-10 text-center select-none cursor-pointer" onclick="resetZoom()" title="Reset Zoom">100%</span>
                            <button onclick="setZoom(0.1)" class="w-6 h-6 flex items-center justify-center text-slate-500 hover:text-slate-900 hover:bg-slate-50 rounded transition-colors" title="Zoom In">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="signature-preview-box flex-grow">
                        <div class="bg-white p-2 rounded shadow-sm border border-slate-100" id="signature-preview">
                            <!-- Signature injected here -->
                        </div>
                    </div>
                </div>



            </div>
        </div>
    </main>

    <!-- Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-lg shadow-xl transform transition-all duration-300 translate-y-24 opacity-0 flex items-center gap-3 z-50">
        <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-message" class="font-medium text-sm">Copied successfully!</span>
    </div>

    <script>
        const THEME_COLOR = "#5A5AEE"; 

        function generateSignatureHTML() {
            const name = document.getElementById('name').value;
            const title = document.getElementById('title').value;
            const website = "www.markgrid.ai";
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const linkedin = "https://www.linkedin.com/company/markgrid-ai/";
            const instagram = "https://www.instagram.com/markgrid.ai?igsh=YTZ1MnU4MWNrcDV1";
            // Get absolute base URL dynamically so images work when copied to emails
            let baseUrl = window.location.href.split('?')[0].split('#')[0];
            if (baseUrl.endsWith('index.html')) {
                baseUrl = baseUrl.replace(/index\.html$/, '');
            }
            if (!baseUrl.endsWith('/')) baseUrl += '/';

            const leftLogo = baseUrl + "images/022.png";
            const rightLogo = baseUrl + "images/markgrid-logo.png";

            return `
<table cellpadding="0" cellspacing="0" border="0" style="font-family: 'Neue Haas Grotesk Display Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; background: #ffffff;">
  <tr>
    <td style="padding-right: 24px; vertical-align: middle; text-align: center;">
      <!-- Left Logo -->
      <img src="${leftLogo}" width="160" style="display: block; width: 160px; max-width: 160px; border: 0;" alt="Markgrid Arrow" />
    </td>
    <td style="vertical-align: middle;">
      <!-- Right Markgrid Logo -->
      <img src="${rightLogo}" width="175" style="display: block; width: 175px; max-width: 175px; border: 0; margin-bottom: 12px;" alt="markgrid" />
      
      <!-- Name & Title -->
      <div style="font-size: 16px; font-weight: bold; text-transform: uppercase; color: #000000; letter-spacing: 0px; line-height: 1; margin-bottom: 0px;">${name}</div>
      <div style="font-size: 14px; color: ${THEME_COLOR}; line-height: 1; margin-bottom: 12px;">${title}</div>
      
      <!-- Contact Info Table -->
      <table cellpadding="0" cellspacing="0" border="0" style="font-size: 12px; font-weight: normal; color: #000000; line-height: 1.1; width: 100%;">
        <tr>
          <td style="padding-right: 6px; padding-bottom: 3px; vertical-align: top;">(W)</td>
          <td style="padding-bottom: 3px; vertical-align: top;"><a href="https://${website.replace(/^https?:\/\//, '')}" style="color: #000000; text-decoration: none;">${website}</a></td>
        </tr>
        <tr>
          <td style="padding-right: 6px; padding-bottom: 3px; vertical-align: top;">(E)</td>
          <td style="padding-bottom: 3px; vertical-align: top;"><a href="mailto:${email}" style="color: #000000; text-decoration: none;">${email}</a></td>
        </tr>
        <tr>
          <td style="padding-right: 6px; vertical-align: middle;">(P)</td>
          <td style="vertical-align: middle;">
            <table cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
              <tr>
                <td style="white-space: nowrap; padding-right: 16px; color: #000000;">${phone}</td>
                <td style="white-space: nowrap; vertical-align: middle; width: 100%; text-align: right;">
                  <!-- Social Icons -->
                  <table cellpadding="0" cellspacing="0" border="0" align="right">
                    <tr>
                      <td style="vertical-align: middle;">
                        <a href="${linkedin}" target="_blank" style="text-decoration: none; display: block;"><img src="${baseUrl}images/li.png" width="16" height="16" style="display: block; border: 0;" alt="LinkedIn" /></a>
                      </td>
                      <td style="width: 4px;"></td>
                      <td style="vertical-align: middle;">
                        <a href="${instagram}" target="_blank" style="text-decoration: none; display: block;"><img src="${baseUrl}images/insta.png" width="16" height="16" style="display: block; border: 0;" alt="Instagram" /></a>
                      </td>

                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
`.trim();
        }

        function updatePreview() {
            const html = generateSignatureHTML();
            document.getElementById('signature-preview').innerHTML = html;
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            
            toast.classList.remove('translate-y-24', 'opacity-0');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        function copySignature() {
            const html = generateSignatureHTML();
            
            const temp = document.createElement("div");
            temp.innerHTML = html;
            document.body.appendChild(temp);
            
            const range = document.createRange();
            range.selectNode(temp);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            
            try {
                document.execCommand('copy');
                showToast("Signature copied! Ready to paste into email client.");
            } catch (err) {
                console.error("Failed to copy:", err);
                alert("Failed to copy signature. Please copy the HTML instead.");
            }
            
            selection.removeAllRanges();
            document.body.removeChild(temp);
        }

        let currentZoom = 1;
        function setZoom(delta) {
            currentZoom += delta;
            if (currentZoom < 0.5) currentZoom = 0.5;
            if (currentZoom > 2.0) currentZoom = 2.0;
            document.getElementById('signature-preview').style.transform = `scale(${currentZoom})`;
            document.getElementById('zoom-level').textContent = `${Math.round(currentZoom * 100)}%`;
        }
        function resetZoom() {
            currentZoom = 1;
            document.getElementById('signature-preview').style.transform = `scale(1)`;
            document.getElementById('zoom-level').textContent = `100%`;
        }

        // Add event listeners to all inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', updatePreview);
        });

        // Add mouse wheel zoom support
        const previewBox = document.querySelector('.signature-preview-box');
        if (previewBox) {
            previewBox.addEventListener('wheel', (e) => {
                e.preventDefault(); // Prevent page scroll
                const zoomAmount = e.deltaY < 0 ? 0.05 : -0.05; // Scroll up = zoom in, scroll down = zoom out
                setZoom(zoomAmount);
            }, { passive: false });
        }

        // Initial generation
        updatePreview();
    </script>
</body>
</html>
